# version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jurion_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://lexi_user:secure_password@postgres:5432/jurion_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=secure_graph_password
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - neo4j
      - redis

  postgres:
    image: pgvector/pgvector:pg16
    container_name: jurion_postgres
    environment:
      POSTGRES_DB: jurion_db
      POSTGRES_USER: lexi_user
      POSTGRES_PASSWORD: secure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5.18.0-community
    container_name: jurion_neo4j
    environment:
      NEO4J_AUTH: neo4j/secure_graph_password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474" # Web Browser UI
      - "7687:7687" # Bolt connection
    volumes:
      - neo4jdata:/data

  redis:
    image: redis:7-alpine
    container_name: jurion_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
  neo4jdata:
