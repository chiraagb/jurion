<!doctype html>
<meta charset="utf-8">
<title>Anatomy of an answer: Jurion</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --ink:#0b0f14; --card:#141b24; --line:#2a3544; --line-hi:#46556b; --parch:#efe6d2; --mute:#a3acb9; --brass:#e3b04b; --ms:6000ms;
          --serif:Georgia, "Times New Roman", serif; --sans:system-ui, sans-serif }
  * { box-sizing:border-box }
  html, body { margin:0; height:100%; background:var(--ink); color:var(--parch); font:15px/1.5 var(--sans) }
  main { display:grid; grid-template-columns:360px 1fr; height:100% }
  aside { padding:24px; display:flex; flex-direction:column; gap:14px; overflow:auto }
  .eyebrow { font:12px/1 ui-monospace, Menlo, monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--brass) }
  h1 { margin:6px 0 0; font:500 32px/1.1 var(--serif) }
  .q { padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--card); font:italic 18px/1.35 var(--serif) }
  .q small { display:block; font:12px ui-monospace, Menlo, monospace; font-style:normal; color:var(--mute); margin-bottom:4px }
  ol { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px }
  .step { position:relative; display:grid; grid-template-columns:30px 1fr; gap:0 12px; width:100%; min-height:44px; text-align:left; color:inherit; font:inherit; background:none; border:1px solid transparent; border-radius:12px; padding:8px 12px; cursor:pointer; overflow:hidden }
  .step:hover { background:#ffffff08; border-color:var(--line) }
  .step .n { grid-row:span 2; align-self:center; width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font:13px ui-monospace, Menlo, monospace; color:var(--mute); border:1px solid var(--line-hi) }
  .step b { font-weight:500; align-self:center }
  .step .d { display:none; grid-column:2; color:var(--mute); font-size:14px }
  .step[aria-current] { background:var(--card); border-color:var(--line-hi) }
  .step[aria-current] .n { background:var(--brass); border-color:var(--brass); color:var(--ink) }
  .step[aria-current] .d { display:block }
  .step.done .n { border-color:var(--brass); color:var(--brass) }
  .bar { position:absolute; left:0; bottom:0; height:2px; width:100%; background:var(--brass); transform:scaleX(0); transform-origin:left }
  .step[aria-current] .bar { animation:fill var(--ms) linear forwards; animation-play-state:var(--run, running) }
  @keyframes fill { to { transform:scaleX(1) } }
  .ctl { display:flex; gap:8px; flex-wrap:wrap }
  .ctl button { min-height:44px; padding:0 14px; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:10px; cursor:pointer; font:500 14px var(--sans) }
  .ctl button:hover { border-color:var(--line-hi) }
  button:focus-visible { outline:2px solid var(--brass); outline-offset:2px }
  .hint { margin:0; font:12px/1.4 ui-monospace, Menlo, monospace; color:var(--mute) }
  section { display:flex; flex-direction:column; justify-content:center; gap:16px; padding:24px; min-width:0 }
  svg { width:100%; height:auto; max-height:70vh }
  #tip { max-width:640px; padding:14px 16px; border:1px solid var(--line-hi); border-radius:14px; background:var(--card) }
  #tip .k { font:11px/1 ui-monospace, Menlo, monospace; letter-spacing:.1em; text-transform:uppercase; color:var(--brass) }
  #tip .o { margin:8px 0 6px; font:500 20px/1.25 var(--serif) }
  #tip .t { margin:0; color:var(--mute) }

  /* diagram */
  .link { fill:none; stroke:#3a4658; stroke-width:1.5 }
  .link.on { stroke:var(--brass); stroke-width:2.5; stroke-dasharray:7 7; animation:flow .8s linear infinite }
  @keyframes flow { to { stroke-dashoffset:-14 } }
  .dot { fill:#fff2cf; opacity:0 } .dot.on { opacity:1 }
  .node rect { fill:var(--card); stroke:var(--line-hi); stroke-width:1.5 }
  .node .t { fill:var(--parch); font:600 15px var(--sans) } .node .s { fill:var(--mute); font:12px var(--sans) }
  .node.hot rect { stroke:var(--brass); stroke-width:2.5 }
  .node.hot { animation:pulse 1.6s ease-in-out infinite }
  @keyframes pulse { 50% { filter:drop-shadow(0 0 12px var(--brass)) } }
  @media (max-width:800px) { main { grid-template-columns:1fr; grid-template-rows:auto 1fr; overflow:auto } html, body { overflow:auto } .q, .hint { display:none } }
  @media (prefers-reduced-motion:reduce) { .link.on, .node.hot { animation:none } .dot { display:none } }
</style>

<main>
  <aside>
    <div><div class="eyebrow">Jurion · architecture</div><h1>Anatomy of an answer</h1></div>
    <div class="q"><small>THE QUESTION WE FOLLOW</small>“When can the bank terminate?”</div>
    <ol id="steps" aria-label="Steps of one question"></ol>
    <div class="ctl"><button id="prev">← Back</button><button id="play">Pause</button><button id="next">Next →</button></div>
    <p class="hint">← → step · space play/pause</p>
  </aside>
  <section>
    <svg id="svg" viewBox="0 0 1000 540" role="img" aria-label="Diagram: browser to API, then Redis, Neo4j, Postgres and OpenAI, and the answer streaming back"></svg>
    <div id="tip" role="status" aria-live="polite"><div class="k"></div><div class="o"></div><p class="t"></p></div>
  </section>
</main>

<script>
const STEP_MS = 6000, REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
// id, title, subtitle, colour, centre x, centre y
const NODES = [
  ["user", "You", "asks a question", "#e3b04b", 90, 270], ["app", "React app", "the browser", "#6cb6ff", 290, 270], ["api", "FastAPI", "runs the pipeline", "#7ee0c6", 500, 270],
  ["redis", "Redis", "rate limit", "#ff7a70", 850, 90], ["neo4j", "Neo4j", "contract graph", "#79d98c", 850, 210],
  ["pg", "Postgres + pgvector", "clauses", "#a99bff", 850, 330], ["openai", "OpenAI", "embed · grade · answer", "#d7dce4", 850, 450],
];
// id, SVG path. Return links curve under the row so they stay visible.
const LINKS = {
  ask: "M165,270 H215", post: "M365,270 H425",
  rl: "M575,270 C700,270 700,90 775,90", scope: "M575,270 C700,270 700,210 775,210", search: "M575,270 C700,270 700,330 775,330", llm: "M575,270 C700,270 700,450 775,450",
  stream: "M450,302 C430,390 340,390 320,302", show: "M260,302 C240,390 140,390 120,302",
};
const STEPS = [
  ["You ask", "user", ["ask", "post"], "One question becomes one request.", "Browser → POST /ask", "“When can the bank terminate?”", "Earlier questions ride along, so “these two contracts” can be understood."],
  ["Check limits", "redis", ["rl"], "Redis keeps the 10-asks-a-minute limit.", "Redis", "Allowed. Not a library question.", "“How many contracts do I have?” skips the AI and reads the database."],
  ["Pick the contract", "neo4j", ["scope"], "The contract graph says which contract this is about.", "Neo4j contract graph", "“the bank” → Acme Bank → bank.pdf", "Doesn’t say which contract? Jurion asks “Which contract?” instead of guessing."],
  ["Search clauses", "pg", ["search"], "Meaning and keywords, merged.", "Postgres + pgvector", "Best clauses by meaning and by words", "Clauses they refer to come along, so “subject to Section 5” brings Section 5."],
  ["Grade and answer", "openai", ["llm"], "Keep only relevant clauses, then answer with citations.", "OpenAI", "Keeps the relevant clauses, cites [1] [2]", "If nothing is relevant it says so instead of guessing."],
  ["Stream it back", "app", ["stream", "show"], "Words appear while the model is still writing.", "FastAPI → React", "Answer, sources, follow-up questions", "Sent as a stream of events; each source links to its clause in the PDF."],
];

// ---- draw the diagram once
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("svg");
const el = (tag, attrs, parent = svg, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text) e.textContent = text; parent.appendChild(e); return e; };
const paths = {}, dots = {}, nodeEl = {};
for (const id in LINKS) {
  paths[id] = el("path", { d: LINKS[id], class: "link", id: "p-" + id });
  dots[id] = el("circle", { r: 5, class: "dot" });
  const m = el("animateMotion", { dur: "1.8s", repeatCount: "indefinite" }, dots[id]); el("mpath", { href: "#p-" + id }, m);
}
for (const [id, title, sub, color, x, y] of NODES) {
  const g = el("g", { class: "node", transform: `translate(${x - 75},${y - 32})` });
  nodeEl[id] = g;
  el("rect", { width: 150, height: 64, rx: 12 }, g); el("rect", { width: 6, height: 40, x: 0, y: 12, fill: color, rx: 3 }, g);
  el("text", { x: id === "user" ? 52 : 20, y: 28, class: "t" }, g, title); el("text", { x: id === "user" ? 52 : 20, y: 47, class: "s" }, g, sub);
}
// a person for "You"
const u = nodeEl.user; el("circle", { cx: 30, cy: 24, r: 7, fill: "#e3b04b" }, u); el("path", { d: "M16,48 q14,-20 28,0 z", fill: "#e3b04b" }, u);

// ---- steps
const ol = document.getElementById("steps"), tip = document.getElementById("tip");
const btns = STEPS.map(([title, , , desc], i) => {
  const li = document.createElement("li"), b = document.createElement("button");
  b.className = "step"; b.innerHTML = `<span class="n">${i + 1}</span><b>${title}</b><span class="d">${desc}</span><span class="bar"></span>`;
  b.onclick = () => { go(i); setPlaying(false); }; li.appendChild(b); ol.appendChild(li); return b;
});
let step = 0, playing = !REDUCED, timer;
function go(i) {
  step = (i + STEPS.length) % STEPS.length;
  const [, node, links, , kicker, out, note] = STEPS[step];
  btns.forEach((b, j) => { j === step ? b.setAttribute("aria-current", "step") : b.removeAttribute("aria-current"); b.classList.toggle("done", j < step); });
  const bar = btns[step].querySelector(".bar"); bar.style.animation = "none"; void bar.offsetWidth; bar.style.animation = ""; // restart the progress bar
  for (const id in paths) { const on = links.includes(id); paths[id].classList.toggle("on", on); dots[id].classList.toggle("on", on); }
  for (const id in nodeEl) nodeEl[id].classList.toggle("hot", id === node);
  tip.querySelector(".k").textContent = kicker; tip.querySelector(".o").textContent = out; tip.querySelector(".t").textContent = note;
  clearTimeout(timer); if (playing) timer = setTimeout(() => go(step + 1), STEP_MS);
}
function setPlaying(p) { playing = p; document.documentElement.style.setProperty("--run", p ? "running" : "paused"); play.textContent = p ? "Pause" : "Play"; if (p) go(step); else clearTimeout(timer); }
const play = document.getElementById("play");
play.onclick = () => setPlaying(!playing);
document.getElementById("next").onclick = () => { go(step + 1); setPlaying(false); };
document.getElementById("prev").onclick = () => { go(step - 1); setPlaying(false); };
addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") { go(step + 1); setPlaying(false); } else if (e.key === "ArrowLeft") { go(step - 1); setPlaying(false); }
  else if (e.key === " " && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); setPlaying(!playing); }
});
setPlaying(playing); go(0);
</script>
